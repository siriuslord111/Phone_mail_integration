<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhoneMail Web</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="web-body">
    <div class="web-shell">
      <aside class="sidebar">
        <div class="brand">PhoneMail</div>
        <nav class="nav">
          <button class="active">Inbox</button>
          <button>Drafts</button>
          <button>Starred</button>
          <button>Trash</button>
        </nav>
      </aside>

      <main class="content-panel">
        <header class="topbar">
          <div class="search-wrap">
            <input type="search" placeholder="Search in emails" />
          </div>
          <div class="profile-pill">AK</div>
        </header>

        <section class="compose-form">
          <h2>Compose</h2>
          <form id="web-form">
            <div class="field-row">
              <label>To</label>
              <input name="to" placeholder="person@example.com or 9876543210@phonemail.com" />
            </div>
            <div class="field-row">
              <label>Subject</label>
              <input name="subject" placeholder="Project update" />
            </div>
            <textarea name="body" rows="6" placeholder="Write an email..."></textarea>
            <div class="action-row">
              <button type="submit" class="primary">Send</button>
            </div>
          </form>
        </section>

        <section class="mail-list">
          <p class="empty-state">No conversations to display.</p>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
